[project]
name = "nanochat-mlx"
version = "0.1.0"
description = "Gated DeltaNet and sliding-window language model research on Apple Silicon"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mlx>=0.32.2",
    "datasets>=4.0.0",
    "fastapi>=0.117.1",
    "numpy>=1.24.0",
    "pyarrow>=14.0.0",
    "regex>=2024.0.0",
    "requests>=2.28.0",
    "scipy>=1.10.0",
    "tabulate>=0.9.0",
    "tokenizers>=0.15.0",
    "uvicorn>=0.24.0",
    "huggingface-hub>=0.20.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "tokenizer: requires the locally installed official tokenizer (no download during tests)",
]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
